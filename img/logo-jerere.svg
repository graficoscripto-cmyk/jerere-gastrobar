<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 84" fill="none" role="img" aria-label="Jereré Gastrobar">
  <!-- Badge circular dourado-palha com o símbolo do jereré (siri + rede caiçara) -->
  <circle cx="42" cy="42" r="39" fill="#E3CE9D" stroke="#4D2418" stroke-width="2"/>
  <g stroke="#4D2418" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Garras superiores (pinças do siri / aro do jereré) -->
    <path d="M25 33 C21 24 27 16 36 15 C34 21 31 26 25 33 Z"/>
    <path d="M59 33 C63 24 57 16 48 15 C50 21 53 26 59 33 Z"/>
    <!-- Arco da carapaça / cesto da rede -->
    <path d="M25 33 C31 27 53 27 59 33 C60 46 53 55 42 55 C31 55 24 46 25 33 Z"/>
    <!-- Trama da rede caiçara (jereré) cruzada no interior e saindo nas laterais como patas -->
    <path d="M27 36 L57 48"/>
    <path d="M57 36 L27 48"/>
    <path d="M25 42 L59 53"/>
    <path d="M59 42 L25 53"/>
    <!-- Pernas laterais inferiores -->
    <path d="M27 41 L19 46"/>
    <path d="M28 46 L21 51"/>
    <path d="M57 41 L65 46"/>
    <path d="M56 46 L63 51"/>
    <!-- Traço de base -->
    <path d="M31 55 L53 55"/>
  </g>
  <!-- Tipografia JERERÉ GASTROBAR -->
  <g fill="#4D2418">
    <text x="94" y="48" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="33" font-weight="700" letter-spacing="1.5">JERERÉ</text>
    <!-- Travessões ornamentais inspirados no logotipo original -->
    <line x1="138" y1="37" x2="154" y2="37" stroke="#A66A2C" stroke-width="1.8"/>
    <line x1="186" y1="37" x2="202" y2="37" stroke="#A66A2C" stroke-width="1.8"/>
    <text x="96" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" letter-spacing="5.5" fill="#7A4424">GASTROBAR</text>
  </g>
</svg>
